# Default Technicals columns. data_api copies this file to screener_columns.toml at startup
# only when that file is missing (data_api/preference_seeds.py); the UI rewrites the live copy.

[[columns]]
name = "RelativeStrengthIndex"
category = "native"
bar_seconds = 3600

[columns.params]
period = 14

[[columns]]
name = "MovingAverageConvergenceDivergence"
category = "native"
bar_seconds = 3600

[columns.params]
fast_period = 12
slow_period = 26
ma_type = "EXPONENTIAL"
price_type = "LAST"

[[columns]]
name = "BollingerBands"
category = "native"
bar_seconds = 14400

[columns.params]
period = 20
k = 2.0
ma_type = "SIMPLE"

[[columns]]
name = "AverageTrueRange"
category = "native"
bar_seconds = 86400

[columns.params]
period = 14
ma_type = "SIMPLE"
use_previous = true
value_floor = 0.0
