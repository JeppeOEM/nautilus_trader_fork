x-logging: &default-logging
  # Known limit: json-file driver rotates by size/file-count, not calendar days -- 20x20MB
  # is a size-based proxy for "~1 month" at typical log volume, not an exact day cutoff.
  # Revisit if log volume changes enough to drift that estimate.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "20"

# data_api's picker PUT (Story 15.6) is the one `rw` writer of this host file; kept as an
# anchor so the path/mount is defined in one place. A views preference store, so it lives under
# data/ with the other durable stores (moved there from a package directory in Story 25.2).
x-chart-indicator-config-path: &chart-indicator-config-path "/app/preferences/chart_indicators.toml"
x-chart-indicator-config-mount: &chart-indicator-config-mount
  ./data/chart_indicators.toml:/app/preferences/chart_indicators.toml:rw

# CPU priority under contention (proposed 2026-09-26, applied by Story 28.1; not enabled yet).
# nifelheim is 2 vCPU / 3.7 GB (`.planning/debug/nifelheim-resource-exhaustion-2026-09-12.md`):
# the load average reached 10.85 on 2 cores, dydx-collector alone sat at ~105 % CPU, and its
# `_second_loop` woke 2-21.5 s late about every 3 minutes (audit D-06/D-07/D-10). Every such stall
# delays the live chart, rankings and alerts, suspends the crossed-book check, and on dYdX leaves
# the missed second without a row. The three collectors are the only services whose work cannot
# wait; archive, ranking_engine, data_api, bot_tui, live-paper and dozzle are batch or interactive
# and can.
# `cpu_shares` is a relative weight the kernel's CFS scheduler applies ONLY when cores are
# contended: with 1024 on each collector and 256 on the rest, a collector gets ~4x the CPU of any
# batch service while the box is busy, and nothing is limited while it is idle. Deliberately not
# `cpus:` (a hard cap): a cap would throttle a collector during a message burst, which is the
# exact moment it must not fall behind. Uncomment the `cpu_shares:` line in each service to apply
# (a `docker compose up -d` recreates the containers); the acceptance check is one hour with the
# load average <= number of cores and zero "_second_loop tick arrived ... late" lines in Dozzle.
services:
  redis:
    container_name: dydx-redis
    # paired with the redis client pin in requirements.txt -- bump both together, RESP3 (8.x) is not wire-compatible with 7.x servers
    image: redis:8-alpine
    ports:
      # Host-side port only -- redis inside the container always listens on 6379
      # regardless. LOCAL_DEV shifts this (see Makefile) so a local dev stack doesn't
      # steal the port troll-web's SSH tunnel forwards from the VPS's real redis.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: always
    logging: *default-logging

  # dYdX capture. Deliberately NOT renamed after its venue for symmetry with the two services
  # below (Story 26.2 decision): the service name `collector` and container `dydx-collector` are
  # operator-visible (Dozzle, `make logs`/`test`/`nightly`/`hotpath-baseline`, the `~/.zshrc`
  # helpers) and published language (the `collector` ERROR_LEDGER_SERVICE ledger file, AD-D12);
  # the rename would buy symmetry only. The image's CMD runs the same module; the explicit
  # `command:` keeps every capture entrypoint visible here and checked by tests/test_images.py.
  collector:
    container_name: dydx-collector
    # cpu_shares: 1024   # see the CPU-priority note above services: (capture: must not wait)
    # Not started by plain `make up`/`docker compose up -d` since the venue cutover (Story 29.3):
    # collection moved to Bybit and Hyperliquid, so dYdX is an explicit, opt-in action --
    # `make up-dydx` starts it, `make down-dydx` removes it. The same profile pattern as
    # live-paper below. The service keeps its name, image and mounts: the maintenance targets
    # (`make test`/`nightly`/`consolidate`/`prune`/`build-candles`/`hotpath-baseline`) still
    # `run` it, and compose enables a profile of a service that is named explicitly. Its archive
    # stays: the `archive` service keeps DYDX in its nightly `venues` until the days age out
    # (docs/DEPLOY_CHECKLIST.md §8).
    profiles: ["dydx"]
    build:
      context: ..
      dockerfile: platform/collector.dockerfile
      network: host
    command: python3 -m capture.venues.dydx
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://127.0.0.1:${REDIS_PORT:-6379}"
      CANDLES_DB_PATH: "/app/candles_dir/candles_dydx.db"
      # Push alert (ntfy.sh-compatible) when every subscribed instrument's book goes
      # stale for 30s+ -- see OBS-01 in CLAUDE.md. Unset means log-only (no push).
      # WATCHDOG_NTFY_URL: "https://ntfy.sh/your-private-topic-here"
      # Durable error ledger (story 23.3): every observability.error_ledger.record() call also
      # appends a JSON line to <ERROR_LEDGER_DIR>/<ERROR_LEDGER_SERVICE>.jsonl.
      ERROR_LEDGER_DIR: "/app/errors_dir"
      ERROR_LEDGER_SERVICE: "collector"
    # Known limit: hardcoded to host uid/gid (single-user box), so ./catalog
    # writes land owned by you, not root. Switch to ${UID}:${GID} if shared.
    user: "1000:1000"
    volumes:
      # rw (not ro): the collector itself writes this file back after a pin/unpin/
      # start/stop/refresh_top_coins control action (Story 6.1) -- still only this
      # container mounts it, bot_tui coordinates via Redis only, never the filesystem.
      # The container path is frozen (AD-D12): capture.venues.dydx.config.CONFIG_PATH defaults
      # to it, and the archive service reads the same path (DYDX_PLAN_PATH).
      - ./data/dydx_config.toml:/app/dydx_collector/config.toml:rw
      - ./data/catalog:/app/catalog
      # Derived SQLite candle store (candles/infrastructure/sqlite_store.py): the collector is its
      # only writer. A directory, not the single file, for the same WAL-sidecar reason as metrics/
      # below. Rebuildable from the catalog: python -m candles.rebuild.
      - ./data/candles:/app/candles_dir
      # Story 5.1: permanent incident reports (crossed book, stale book, resync, etc.),
      # auto-snapshotted from the [WS_RAW] rolling debug buffer -- see
      # observability/incidents.py's IncidentHandler, configured by capture/venues/dydx/__main__.py's
      # INCIDENTS. Must survive container restarts, unlike /tmp/nautilus_logs.
      - ./data/incident_reports:/app/incident_reports
      # Story 23.3: durable per-service error ledger, survives restarts/rebuilds/Redis loss.
      - ./data/errors:/app/errors_dir
    network_mode: host
    restart: always
    logging: *default-logging

  bybit_collector:
    container_name: bybit-collector
    # cpu_shares: 1024   # see the CPU-priority note above services: (capture: must not wait)
    build:
      context: ..
      dockerfile: platform/collector.dockerfile
      network: host
    command: python3 -m capture.venues.bybit
    environment:
      PYTHONUNBUFFERED: "1"
      BYBIT_COLLECTOR_CONFIG: "/app/bybit_config.toml"
      REDIS_URL: "redis://127.0.0.1:${REDIS_PORT:-6379}"
      CANDLES_DB_PATH: "/app/candles_dir/candles_bybit.db"
      # OBS-01 push alert (ntfy.sh-compatible); unset means log-only. See the dYdX service.
      # WATCHDOG_NTFY_URL: "https://ntfy.sh/your-private-topic-here"
      ERROR_LEDGER_DIR: "/app/errors_dir"
      ERROR_LEDGER_SERVICE: "bybit_collector"
    user: "1000:1000"
    volumes:
      # rw: the plan store writes it back -- a collector:control command addressed to this
      # venue saves the plan here before applying it (Story 29.4). The file is the committed
      # one, so a runtime command leaves the checkout modified (docs/DEPLOY_CHECKLIST.md).
      - ./capture/venues/bybit/config.toml:/app/bybit_config.toml:rw
      # Same catalog root as the dYdX collector (Story 19.2): data_api serves both.
      - ./data/catalog:/app/catalog
      - ./data/candles:/app/candles_dir
      - ./data/errors:/app/errors_dir
    network_mode: host
    restart: always
    logging: *default-logging

  hyperliquid_collector:
    container_name: hyperliquid-collector
    # cpu_shares: 1024   # see the CPU-priority note above services: (capture: must not wait)
    build:
      context: ..
      dockerfile: platform/collector.dockerfile
      network: host
    command: python3 -m capture.venues.hyperliquid
    environment:
      PYTHONUNBUFFERED: "1"
      HYPERLIQUID_COLLECTOR_CONFIG: "/app/hyperliquid_config.toml"
      REDIS_URL: "redis://127.0.0.1:${REDIS_PORT:-6379}"
      CANDLES_DB_PATH: "/app/candles_dir/candles_hyperliquid.db"
      # WATCHDOG_NTFY_URL: "https://ntfy.sh/your-private-topic-here"
      ERROR_LEDGER_DIR: "/app/errors_dir"
      ERROR_LEDGER_SERVICE: "hyperliquid_collector"
    user: "1000:1000"
    volumes:
      # rw: the plan store writes it back -- a collector:control command addressed to this
      # venue saves the plan here before applying it (Story 29.4). The file is the committed
      # one, so a runtime command leaves the checkout modified (docs/DEPLOY_CHECKLIST.md).
      - ./capture/venues/hyperliquid/config.toml:/app/hyperliquid_config.toml:rw
      # Same catalog root as the dYdX collector (Story 19.2): data_api serves both.
      - ./data/catalog:/app/catalog
      - ./data/candles:/app/candles_dir
      - ./data/errors:/app/errors_dir
    network_mode: host
    restart: always
    logging: *default-logging

  archive:
    container_name: archive
    # cpu_shares: 256   # see the CPU-priority note above services: (batch: may wait)
    # Nightly maintenance scheduled in our own code (Story 25.1b; archive/scheduler.py): each
    # venue's nightly saga at archive/config.toml's `nightly_at` (UTC), then consolidate, then the
    # rclone backup when that file's `backup_enabled` is true (committed false until off-site
    # storage exists, Story 26.1b), each step its own child process; catch-up of missed days after downtime; the
    # closed-hour merge of the small types every `intraday_consolidate_hours`. Replaces the host
    # crontab line (docs/DEPLOY_CHECKLIST.md §1). Status on `archive:status`, run-now on
    # `archive:control`. Takes no capture lock: every step writes closed days or closed hours only,
    # so the collectors keep running; `make nightly`/`consolidate`/`backup-catalog` stay as manual
    # tools and share the catalog maintenance lock with it.
    build:
      context: ..
      dockerfile: platform/collector.dockerfile
      network: host
    command: python3 -m archive.scheduler
    environment:
      PYTHONUNBUFFERED: "1"
      # uid 1000 has no /etc/passwd entry in the image: rclone and tempfile need a writable HOME.
      HOME: "/tmp"
      REDIS_URL: "redis://127.0.0.1:${REDIS_PORT:-6379}"
      CATALOG_PATH: "/app/catalog"
      CANDLES_DIR: "/app/candles_dir"
      DYDX_PLAN_PATH: "/app/dydx_collector/config.toml"
      ARCHIVE_STATE_DIR: "/app/archive_state"
      ARCHIVE_CONFIG: "/app/archive/config.toml"
      # The backup target, from platform/.env (see .env-example). Unused while archive/config.toml
      # has `backup_enabled = false`; with true, an empty one refuses the service's start
      # (archive.config_invalid), never a silent skip.
      RCLONE_REMOTE: "${RCLONE_REMOTE:-}"
      RCLONE_BUCKET: "${RCLONE_BUCKET:-}"
      RCLONE_CONFIG: "/app/rclone/rclone.conf"
      ERROR_LEDGER_DIR: "/app/errors_dir"
      ERROR_LEDGER_SERVICE: "archive"
    user: "1000:1000"
    volumes:
      # rw: the nightly saga rebuilds, consolidates and prunes closed days (never today's files).
      - ./data/catalog:/app/catalog
      # rw: the saga's build_candles step refolds closed days into the candle store.
      - ./data/candles:/app/candles_dir
      - ./data/errors:/app/errors_dir
      # The scheduler cursor state.json (not a data verdict). Never mounted over /app/archive,
      # which is the package itself.
      - ./data/archive:/app/archive_state
      # ro: the dYdX plan, for the saga's dYdX retention (the collector is its one writer).
      - ./data/dydx_config.toml:/app/dydx_collector/config.toml:ro
      # ro: the schedule; an edit applies on `docker compose restart archive`, no rebuild.
      - ./archive/config.toml:/app/archive/config.toml:ro
      # ro: the operator's rclone config (`rclone config` on the host; never in this repo).
      - ${RCLONE_CONFIG_DIR:-${HOME}/.config/rclone}:/app/rclone:ro
    network_mode: host
    restart: always
    logging: *default-logging

  ranking_engine:
    container_name: dydx-ranking-engine
    # cpu_shares: 256   # see the CPU-priority note above services: (batch/interactive: may wait)
    build:
      context: ..
      dockerfile: platform/collector.dockerfile
      network: host
    command: python3 -m ranking
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://127.0.0.1:${REDIS_PORT:-6379}"
      CATALOG_PATH: "/app/catalog"
      DYDX_NETWORK: "mainnet"
      # Must match capture/venues/bybit's / capture/venues/hyperliquid's config.toml `environment`
      # (ranking_engine polls each venue's USD 24h volume from that network).
      BYBIT_ENVIRONMENT: "mainnet"
      HYPERLIQUID_ENVIRONMENT: "mainnet"
      RANKING_VOLATILITY_LOOKBACK_SECONDS: "3600"
      RANKING_HEARTBEAT_SECONDS: "5"
      METRICS_DB_PATH: "/app/metrics_dir/metrics.db"
      ERROR_LEDGER_DIR: "/app/errors_dir"
      ERROR_LEDGER_SERVICE: "ranking_engine"
    user: "1000:1000"
    volumes:
      # Catalog is read-only -- ranking only reads it for the one-time per-instrument price
      # backfill (ranking.infrastructure.catalog_prices), same AD-3 "reader trusts the gate"
      # discipline as data_api's mount. metrics/ is read-write -- this is now
      # the sole writer (Task 7). Mounted as a directory, not the single metrics.db file:
      # SQLite WAL mode creates -wal/-shm sidecars next to it, and a single-file bind
      # mount can't expose those on a path shared with another container.
      - ./data/catalog:/app/catalog:ro
      - ./data/metrics:/app/metrics_dir
      - ./data/errors:/app/errors_dir
    network_mode: host
    restart: always
    logging: *default-logging

  data_api:
    container_name: dydx-data-api
    # cpu_shares: 256   # see the CPU-priority note above services: (batch/interactive: may wait)
    build:
      context: ..
      dockerfile: platform/data_api.dockerfile
      network: host
    command: uvicorn data_api.app:app --host 127.0.0.1 --port ${DATA_API_PORT:-9100}
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://127.0.0.1:${REDIS_PORT:-6379}"
      CATALOG_PATH: "/app/catalog"
      METRICS_DB_PATH: "/app/metrics_dir/metrics.db"
      CANDLES_DB_DIR: "/app/candles_dir"
      CHART_INDICATOR_CONFIG_PATH: *chart-indicator-config-path
      SCREENER_COLUMNS_CONFIG_PATH: "/app/preferences/screener_columns.toml"
      ALERTS_PATH: "/app/data_api/alerts.toml"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      ERROR_LEDGER_DIR: "/app/errors_dir"
      ERROR_LEDGER_SERVICE: "data_api"
    user: "1000:1000"
    volumes:
      - ./data/catalog:/app/catalog:ro
      - ./data/metrics:/app/metrics_dir:ro
      - ./data/candles:/app/candles_dir:ro
      # rw (not ro): data_api both writes its own process_start/record() lines here and
      # reads every service's files back for GET /api/errors' `services` block (story 23.3).
      - ./data/errors:/app/errors_dir
      # rw: saved alerts (Story 20.1) -- host file must exist (committed empty), same reason.
      - ./data_api/alerts.toml:/app/data_api/alerts.toml:rw
      # rw: the Technicals tab's screener-wide column list (Story 17.5). The host file must
      # exist (committed empty) or Docker would create a directory at this path.
      - ./data/screener_columns.toml:/app/preferences/screener_columns.toml:rw
      # rw (not ro): the picker's PUT /api/coin/{iid}/indicators (Story 15.6) writes this
      # file back on every add/remove/param-apply change -- the one `rw` mount
      # of this file.
      - *chart-indicator-config-mount
    network_mode: host
    restart: always
    logging: *default-logging

  bot_tui:
    container_name: dydx-bot-tui
    # cpu_shares: 256   # see the CPU-priority note above services: (batch/interactive: may wait)
    # Not part of `make up` / `docker compose up -d` at all -- bot_tui is an
    # interactive urwid app (Story 4.1, architecture spine's Deployment &
    # Environments section: "not a long-running background service... not a
    # restart: always daemon"), launched via `docker compose run`, never `up -d`.
    # profiles: ["tui"] keeps it out of the default `up` service set for that reason
    # -- a different rationale than live-paper's profile gating above (that one is
    # about crash-loop safety for a daemon; this one is about "never auto-started,
    # period", since a one-shot interactive process has no meaningful "up" state).
    profiles: ["tui"]
    build:
      context: ..
      dockerfile: platform/collector.dockerfile
      network: host
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://127.0.0.1:${REDIS_PORT:-6379}"
      BOT_TUI_LOG_PATH: "/app/bot_tui_logs/bot_tui.log"
      # `docker compose run` never forwards the host's TERM -- without it urwid's
      # raw_display.Screen can't decode arrow-key escape sequences at all (single-byte
      # keys like enter/esc/:/s/d/o still work, which is why only arrow-key navigation
      # broke). Hardcoded to a value guaranteed present in the image's terminfo db,
      # not the host's own TERM -- an unusual host terminal (e.g. "xterm-ghostty") has
      # no matching terminfo entry inside the container at all.
      TERM: "xterm-256color"
      # Bot-detail's `o` deep-link target (Story 4.7) -- data_api serves the SPA, and
      # 127.0.0.1:<port> is reachable here exactly as from the host (both run network_mode: host).
      DASHBOARD_BASE_URL: "http://127.0.0.1:${DATA_API_PORT:-9100}"
      # Set by troll-tui (~/.zshrc) to the port its -R reverse SSH tunnel binds
      # on this host -- see app.py's _open_via_local_listener. Unset (e.g.
      # bot_tui run on-host, not over troll-tui) means that hand-off is simply
      # skipped in favor of webbrowser.open()/OSC52.
      BOT_TUI_OPEN_URL_PORT: "${BOT_TUI_OPEN_URL_PORT:-}"
      ERROR_LEDGER_DIR: "/app/errors_dir"
      ERROR_LEDGER_SERVICE: "bot_tui"
    user: "1000:1000"
    volumes:
      # bot_tui.log is written here instead of stderr/stdout to avoid corrupting the
      # full-screen urwid display (see app.py's main()). `docker compose run --rm`
      # discards the container's writable layer on exit, so without this bind mount the
      # log -- including any crash traceback -- would be lost the instant the run ends.
      - ./data/bot_tui_logs:/app/bot_tui_logs
      - ./data/errors:/app/errors_dir
      # Read-only: bot_tui's own image (collector.dockerfile) never COPYs bots/ in, per
      # AD-8's module isolation. This mount only lets the `v` key display the strategy's
      # source text -- no bots code is imported or run here. The container path is the one
      # bot_tui reads (STRATEGY_SOURCE_PATH's default): outside every package directory, so the
      # mount can never shadow or create an importable package (Story 26.3).
      - ./bots/strategies/dummy.py:/app/strategy_source/strategy.py:ro
    network_mode: host
    logging: *default-logging

  live-paper:
    container_name: dydx-live-paper
    # cpu_shares: 256   # see the CPU-priority note above services: (batch/interactive: may wait)
    # Not started by plain `make up`/`docker compose up -d` -- this profile keeps the
    # paper-trading node an explicit, opt-in action (`make up-live-paper`), consistent
    # with Story 3.1's "unreachable by any default or accidental config state" goal.
    profiles: ["live-paper"]
    build:
      context: ..
      dockerfile: platform/bots.dockerfile
      network: host
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://127.0.0.1:${REDIS_PORT:-6379}"
      FILLS_DB_PATH: "/app/data/live_paper/fills.db"
      # Set to an explicit, differently-named file path to enable the non-Sandbox exec
      # path (mode = "real_money" or "exchange_demo") -- never set by default here.
      # See bots/infrastructure/config.py's module docstring.
      # LIVE_PAPER_REAL_MONEY_CONFIG: "/app/bots/real_money.toml"
      # Venue credentials for that path only. Each adapter's Rust client picks the pair
      # matching the environment it was configured with, so they are passed straight
      # through rather than read anywhere in Python. Value-less entries forward a var
      # only when the host exports it; an unset one stays UNSET inside the container.
      # That distinction matters: the Rust clients take any present value as a key
      # (`std::env::var(..).ok()`), so an empty-string default would hand the paper
      # path's public Hyperliquid data client `HYPERLIQUID_PK=""`, which it rejects at
      # construction ("EVM private key must be 32 bytes"), and would make the Bybit
      # instrument provider sign its fee-rate call with an empty secret.
      BYBIT_API_KEY:
      BYBIT_API_SECRET:
      BYBIT_DEMO_API_KEY:
      BYBIT_DEMO_API_SECRET:
      BYBIT_TESTNET_API_KEY:
      BYBIT_TESTNET_API_SECRET:
      # HYPERLIQUID_ACCOUNT_ADDRESS is deliberately un-suffixed -- the Rust side reads
      # the one name on both mainnet and testnet (crates/.../hyperliquid/src/account.rs).
      HYPERLIQUID_PK:
      HYPERLIQUID_VAULT:
      HYPERLIQUID_TESTNET_PK:
      HYPERLIQUID_TESTNET_VAULT:
      HYPERLIQUID_ACCOUNT_ADDRESS:
      DYDX_PRIVATE_KEY:
      DYDX_WALLET_ADDRESS:
      DYDX_TESTNET_PRIVATE_KEY:
      DYDX_TESTNET_WALLET_ADDRESS:
      ERROR_LEDGER_DIR: "/app/errors_dir"
      ERROR_LEDGER_SERVICE: "live-paper"
    user: "1000:1000"
    volumes:
      # The paper fleet's config (Story 25.3: moved with the code, read by `python3 -m bots`
      # next to its package).
      - ./bots/config.toml:/app/bots/config.toml:ro
      # Directory mount, not the single fills.db file (Story 4.6) -- SQLite WAL mode
      # creates fills.db-wal/fills.db-shm sidecar files next to the main file, which a
      # single-file bind mount can't expose (same gotcha already documented on the
      # ranking_engine and data_api metrics.db mounts above). The container path mirrors the host
      # one, which is also FILLS_DB_PATH's in-image default (bots/__main__.py), since Story 26.3.
      - ./data/live_paper:/app/data/live_paper
      - ./data/errors:/app/errors_dir
    network_mode: host
    # on-failure (not `always`, unlike collector/data_api) -- Story 3.2 attached a real
    # Strategy that submits live paper orders, so a persistent bad-config or transient
    # startup failure must not crash-loop against dYdX's API as fast as Docker allows.
    # Flagged in deferred-work.md's Story 3.1 entry to revisit exactly here.
    restart: on-failure:5
    logging: *default-logging

  dozzle:
    container_name: dydx-collector-dozzle
    # cpu_shares: 256   # see the CPU-priority note above services: (batch/interactive: may wait)
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-8080}:8080"
    restart: always
    logging: *default-logging
