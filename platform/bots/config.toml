# Stress-test config -- 40 bots across 30 instruments, for VPS load-testing
# AD-11's one-node-many-bots shape (platform/CLAUDE.md, ARCHITECTURE-SPINE.md AD-11).
#
# Deliberately at the collector's own established safety margin: 30 distinct
# instruments = 30 v4_orderbook subscriptions on this ONE connection, right at
# DYDX_MAX_COLLECTED_INSTRUMENTS's cap (capture/venues/dydx/config.py) -- a real test of
# the subscription budget, not just bot count. 10 of the 30 coins get a second bot
# with different thresholds (same instrument_id, different bot_id) -- this is the
# exact scenario AD-11's bot_status.py fix (strategy_id-scoped Cache queries,
# instead of the account-wide Portfolio facade) exists for: two bots sharing an
# instrument must never blend PnL/exposure.
#
# trade_size is NOT calibrated per-instrument (0.001 BTC and 0.001 DOGE are wildly
# different position sizes) -- fine for a connectivity/subscription/isolation
# stress test, not meant to be a realistic PnL run. starting_balances is the ONE
# shared simulated pool every dYdX bot below draws from (AD-11) -- sized up from the
# 2-bot default to give 40 bots headroom. Each venue in use gets its own pool.
log_level = "INFO"

[venues.DYDX]
environment = "mainnet"
starting_balances = ["100_000 USDC"]
account_type = "MARGIN"

# Other venues: add a bot with e.g. instrument_id = "BTCUSDT-LINEAR.BYBIT" or
# "BTC-USD-PERP.HYPERLIQUID" and (optionally) uncomment its table. Absent tables use
# environment "mainnet", MARGIN, and 10_000 of the venue's quote currency.
# A Bybit spot and a Bybit linear bot may share the node -- see README.md.
# [venues.BYBIT]
# environment = "mainnet"        # mainnet | demo | testnet
# starting_balances = ["10_000 USDT"]
# [venues.HYPERLIQUID]
# environment = "mainnet"        # mainnet | testnet
# starting_balances = ["10_000 USDC"]

