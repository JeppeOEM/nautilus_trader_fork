# dYdX market data collector configuration.
network = "mainnet"
catalog_path = "catalog"
flush_interval_seconds = 60
config_reload_seconds = 30
open_interest_poll_seconds = 300

# Liquidity tiers
# Coins with open interest >= liquidity_min_oi_usd are subscribed (trades + orderbook).
# Coins below the threshold are tracked in an illiquid pool and re-checked periodically.
liquidity_min_oi_usd = 1000        # $1k 24h volume = subscribed (field is volume24H in USD, not openInterest in tokens)
liquidity_check_seconds = 1800     # re-check illiquid coins every 30 min

# Data retention
# Pinned coins are kept indefinitely. All other subscribed coins pruned after this many hours.
non_config_retain_hours = 4

# Instruments to never collect, even if they'd qualify by volume or are pinned.
exclude = []

# Pinned instruments: locked in forever regardless of volume tier.
# Run `python3 -m dydx_collector.update_pinned` to refresh this list to top 40 by volume.

