# Stress-test config -- 40 bots across 30 instruments, for VPS load-testing
# AD-11's one-node-many-bots shape (troll/CLAUDE.md, ARCHITECTURE-SPINE.md AD-11).
#
# Deliberately at the collector's own established safety margin: 30 distinct
# instruments = 30 v4_orderbook subscriptions on this ONE connection, right at
# _MAX_COLLECTED_INSTRUMENTS's cap (dydx_collector/collector.py) -- a real test of
# the subscription budget, not just bot count. 10 of the 30 coins get a second bot
# with different thresholds (same instrument_id, different bot_id) -- this is the
# exact scenario AD-11's bot_status.py fix (strategy_id-scoped Cache queries,
# instead of the account-wide Portfolio facade) exists for: two bots sharing an
# instrument must never blend PnL/exposure.
#
# trade_size is NOT calibrated per-instrument (0.001 BTC and 0.001 DOGE are wildly
# different position sizes) -- fine for a connectivity/subscription/isolation
# stress test, not meant to be a realistic PnL run. starting_balances is the ONE
# shared simulated pool every bot below draws from (AD-11) -- sized up from the
# 2-bot default to give 40 bots headroom.
network = "mainnet"
starting_balances = ["100_000 USDC"]
account_type = "MARGIN"
log_level = "INFO"

[[bots]]
bot_id = "bot-01"
instrument_id = "BTC-USD-PERP.DYDX"
trade_size = "0.0012"
trend_buy_threshold = 0.56
trend_sell_threshold = 0.39
ofi_confirm_threshold = -0.4
starting_balance = "10_000 USDC"

