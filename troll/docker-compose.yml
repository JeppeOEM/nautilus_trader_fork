x-logging: &default-logging
  # ponytail: json-file driver rotates by size/file-count, not calendar days -- 20x20MB
  # is a size-based proxy for "~1 month" at typical log volume, not an exact day cutoff.
  # Revisit if log volume changes enough to drift that estimate.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "20"

services:
  redis:
    container_name: dydx-redis
    # paired with the redis client pin in troll-requirements.txt -- bump both together, RESP3 (8.x) is not wire-compatible with 7.x servers
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    logging: *default-logging

  collector:
    container_name: dydx-collector
    build:
      context: ..
      dockerfile: troll/collector.dockerfile
      network: host
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://127.0.0.1:6379"
      # Push alert (ntfy.sh-compatible) when every subscribed instrument's book goes
      # stale for 30s+ -- see OBS-01 in CLAUDE.md. Unset means log-only (no push).
      # WATCHDOG_NTFY_URL: "https://ntfy.sh/your-private-topic-here"
    # ponytail: hardcoded to host uid/gid (single-user box), so ./catalog
    # writes land owned by you, not root. Switch to ${UID}:${GID} if shared.
    user: "1000:1000"
    volumes:
      - ./config.toml:/app/dydx_collector/config.toml:ro
      - ./dydx_collector/catalog:/app/catalog
      - ./dydx_collector/metrics.db:/app/metrics.db
    network_mode: host
    restart: always
    logging: *default-logging

  dashboard:
    container_name: dydx-dashboard
    build:
      context: ..
      dockerfile: troll/collector.dockerfile
      network: host
    command: python3 -m ml_signals.dashboard
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://127.0.0.1:6379"
      CATALOG_PATH: "/app/catalog"
      DASHBOARD_PORT: "8765"
      METRICS_DB_PATH: "/app/metrics_dir/metrics.db"
    user: "1000:1000"
    volumes:
      - ./dydx_collector/catalog:/app/catalog:ro
      # ranking_engine is now the sole writer of metrics.db (Story 1.8, Task 7) --
      # dashboard only ever reads it (metrics_store.latest/nearest/history), so this
      # mount gains :ro, mirroring the same structural enforcement the catalog mount
      # above already demonstrates for AD-3.
      #
      # Mounted as a *directory* (./dydx_collector/metrics/), not the single metrics.db
      # file: SQLite WAL mode creates metrics.db-wal/metrics.db-shm sidecar files next
      # to the main file, and a single-file bind mount can't expose those sidecars on a
      # path shared with another container -- ranking_engine's writes could land in
      # this container's own private overlay instead of becoming visible here. Mounting
      # the containing directory lets every sidecar land on the same shared host path.
      - ./dydx_collector/metrics:/app/metrics_dir:ro
    network_mode: host
    restart: always
    logging: *default-logging

  ranking_engine:
    container_name: dydx-ranking-engine
    build:
      context: ..
      dockerfile: troll/collector.dockerfile
      network: host
    command: python3 -m ranking_engine.engine
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://127.0.0.1:6379"
      CATALOG_PATH: "/app/catalog"
      DYDX_NETWORK: "mainnet"
      RANKING_VOLATILITY_LOOKBACK_SECONDS: "3600"
      RANKING_HEARTBEAT_SECONDS: "5"
      METRICS_DB_PATH: "/app/metrics_dir/metrics.db"
    user: "1000:1000"
    volumes:
      # Catalog is read-only -- ranking_engine only reads it via
      # ml_signals.metrics_computer.compute_all(), same AD-3 "reader trusts the gate"
      # discipline as dashboard's mount above. metrics/ is read-write -- this is now
      # the sole writer (Task 7), matching the same reasoning that put :ro on
      # dashboard's mount. Mounted as a directory, not the single metrics.db file --
      # see dashboard's mount comment above for why (WAL/SHM sidecar visibility).
      - ./dydx_collector/catalog:/app/catalog:ro
      - ./dydx_collector/metrics:/app/metrics_dir
    network_mode: host
    restart: always
    logging: *default-logging

  bot_tui:
    container_name: dydx-bot-tui
    # Not part of `make up` / `docker compose up -d` at all -- bot_tui is an
    # interactive urwid app (Story 4.1, architecture spine's Deployment &
    # Environments section: "not a long-running background service... not a
    # restart: always daemon"), launched via `docker compose run`, never `up -d`.
    # profiles: ["tui"] keeps it out of the default `up` service set for that reason
    # -- a different rationale than live-paper's profile gating above (that one is
    # about crash-loop safety for a daemon; this one is about "never auto-started,
    # period", since a one-shot interactive process has no meaningful "up" state).
    profiles: ["tui"]
    build:
      context: ..
      dockerfile: troll/collector.dockerfile
      network: host
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://127.0.0.1:6379"
      BOT_TUI_LOG_PATH: "/app/bot_tui_logs/bot_tui.log"
      # Story 4.3's `o` deep-link target -- 127.0.0.1:8765 is reachable here exactly
      # as it is from the host, since both `dashboard` and `bot_tui` run
      # network_mode: host with no separate port mapping.
      DASHBOARD_BASE_URL: "http://127.0.0.1:8765"
    user: "1000:1000"
    volumes:
      # bot_tui.log is written here instead of stderr/stdout to avoid corrupting the
      # full-screen urwid display (see app.py's main()). `docker compose run --rm`
      # discards the container's writable layer on exit, so without this bind mount the
      # log -- including any crash traceback -- would be lost the instant the run ends.
      - ./bot_tui_logs:/app/bot_tui_logs
    network_mode: host
    logging: *default-logging

  live-paper:
    container_name: dydx-live-paper
    # Not started by plain `make up`/`docker compose up -d` -- this profile keeps the
    # paper-trading node an explicit, opt-in action (`make up-live-paper`), consistent
    # with Story 3.1's "unreachable by any default or accidental config state" goal.
    profiles: ["live-paper"]
    build:
      context: ..
      dockerfile: troll/live_paper.dockerfile
      network: host
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://127.0.0.1:6379"
      FILLS_DB_PATH: "/app/live_paper/data/fills.db"
      # Set to an explicit, differently-named file path to enable real-money execution --
      # never set by default here. See live_paper/config.py's module docstring.
      # LIVE_PAPER_REAL_MONEY_CONFIG: "/app/live_paper/real_money.toml"
    user: "1000:1000"
    volumes:
      - ./live_paper/config.toml:/app/live_paper/config.toml:ro
      # Directory mount, not the single fills.db file (Story 4.6) -- SQLite WAL mode
      # creates fills.db-wal/fills.db-shm sidecar files next to the main file, which a
      # single-file bind mount can't expose (same gotcha already documented on
      # ranking_engine/dashboard's metrics.db mounts above).
      - ./live_paper/data:/app/live_paper/data
    network_mode: host
    # on-failure (not `always`, unlike collector/dashboard) -- Story 3.2 attached a real
    # Strategy that submits live paper orders, so a persistent bad-config or transient
    # startup failure must not crash-loop against dYdX's API as fast as Docker allows.
    # Flagged in deferred-work.md's Story 3.1 entry to revisit exactly here.
    restart: on-failure:5
    logging: *default-logging

  dozzle:
    container_name: dydx-collector-dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    logging: *default-logging
