services:
  collector:
    container_name: dydx-collector
    build:
      context: ../..
      dockerfile: troll/dydx_collector/collector.dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
    # ponytail: hardcoded to host uid/gid (single-user box), so ./catalog
    # writes land owned by you, not root. Switch to ${UID}:${GID} if shared.
    user: "1000:1000"
    volumes:
      - ./config.toml:/app/dydx_collector/config.toml:ro
      - ./catalog:/app/catalog
    restart: unless-stopped

  dozzle:
    container_name: dydx-collector-dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
